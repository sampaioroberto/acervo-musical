name: Verify
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_DEMO: "true"
      - run: npm run backend:start
      - run: node_modules/.bin/supabase test db
      - run: npm run test:integration
      - run: npm run test:e2e:setup
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Stop local test services
        if: always()
        run: node_modules/.bin/supabase stop
